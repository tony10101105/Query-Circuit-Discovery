[project]
name = "eap"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Hanna", email = "mh2parker@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.1",
    "transformer-lens==2.15.0",
    "sae-lens==6.5.0",
    "torch==2.6.0+cu126",
    "torchvision==0.21.0+cu126",
    "transformers>=4.40.0,<5.0.0",
    "awscli==1.44.38",
    "dotenv==0.9.9",
    "python-dotenv==1.2.2",
    "argparse==1.4.0",
    "anthropic==0.87.0",
    "openai==2.38.0",
]

[project.optional-dependencies]
viz = ["pygraphviz>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
